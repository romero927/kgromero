<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    /></noscript>
    <!-- Immediate theme detection script -->
    <script>
      (() => {
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme) {
          document.documentElement.classList.toggle(
            "dark",
            savedTheme === "dark",
          );
        } else {
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          document.documentElement.classList.toggle("dark", prefersDark);
        }

        // Background animation is off unless the visitor turned it on:
        // show the plain page with solid cards.
        document.documentElement.classList.toggle(
          "animations-off",
          localStorage.getItem("animations") !== "on",
        );

        // iOS Safari only applies :active (our tap feedback) when the page
        // listens for touches.
        document.addEventListener("touchstart", () => {}, { passive: true });
      })();
    </script>
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="bg-neo-cream dark:bg-dark-bg"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
